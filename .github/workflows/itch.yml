# Every push to main: export the Windows and Linux builds and push them to itch.io.
# Windows -> the ROG Ally (and other PCs). Linux -> Steam Deck and Linux PCs.
# The itch app sees each new version and updates the game itself.
# Needs the repository secret BUTLER_API_KEY (an itch.io API key).
name: Ship to itch.io

on:
  push:
    branches: [main]
    paths: ["godot/**", "itch/**", ".github/workflows/itch.yml"]
  workflow_dispatch: {}           # or run it by hand from the Actions tab

concurrency:
  group: itch
  cancel-in-progress: true        # two quick pushes: only the newest gets built

env:
  GODOT_VERSION: "4.7"
  ITCH_PROJECT: "fizzehbuboleh/arborsim"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # a broken Linux build never blocks the Windows one
      matrix:
        include:
          - channel: windows
            preset: "Windows Desktop"
            binary: ArborSimulator.exe
          - channel: linux
            preset: "Linux"
            binary: ArborSimulator.x86_64
    name: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Godot and the export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export the ${{ matrix.channel }} build
        working-directory: godot
        run: |
          out="build/${{ matrix.channel }}"
          # stamp the build so the game can show which one you're on
          echo "build $(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" > build_id.txt
          godot --headless --path . --import || true
          mkdir -p "$out"
          godot --headless --path . --export-release "${{ matrix.preset }}" "$out/${{ matrix.binary }}"
          cp ../README.md "$out/README.md"
          if [ "${{ matrix.channel }}" = "linux" ]; then
            chmod +x "$out/${{ matrix.binary }}"
            cp "../itch/linux/README - Steam Deck.txt" "$out/"
            # tells the itch app (and Steam Deck players using it) which file to launch
            printf '[[actions]]\nname = "play"\npath = "%s"\n' "${{ matrix.binary }}" > "$out/.itch.toml"
          fi
          ls -la "$out"
          test -f "$out/${{ matrix.binary }}"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push "godot/build/${{ matrix.channel }}" "${ITCH_PROJECT}:${{ matrix.channel }}" \
            --userversion "${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
